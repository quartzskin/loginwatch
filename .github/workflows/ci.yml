name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\run-tests.ps1
      - name: gui self test
        shell: powershell
        run: powershell -NoProfile -STA -File .\loginwatch-gui.ps1 -SelfTest -Png gui-ci.png
